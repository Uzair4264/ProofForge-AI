[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbreport-assistant"
version = "0.1.0"
description = "ProofForge AI — a local-first assistant for evidence-backed, program-compliant bug bounty reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ProofForge AI contributors" }]
keywords = ["bug-bounty", "security", "reporting", "cvss", "local-first"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bbreport = "bbreport_assistant.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["bbreport_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
