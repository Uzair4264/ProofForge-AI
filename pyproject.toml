[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofforge-ai"
version = "0.1.0"
description = "ProofForge AI — a local-first assistant for evidence-backed, program-compliant bug bounty reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Syed Uzair Ali" }]
keywords = ["bug-bounty", "security", "reporting", "cvss", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Uzair4264/ProofForge-AI"
Issues = "https://github.com/Uzair4264/ProofForge-AI/issues"

[project.scripts]
proofforge = "proofforge.cli.main:app"
bbreport = "proofforge.cli.main:app"  # legacy alias, kept for existing users

[tool.hatch.build.targets.wheel]
packages = ["src/proofforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
