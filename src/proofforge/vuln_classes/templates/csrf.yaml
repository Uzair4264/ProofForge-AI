vuln_class: csrf
display_name: "Cross-Site Request Forgery"
cwe: CWE-352
subtypes:
  - form_based
  - json_based
  - get_based

required_fields:
  - id: affected_endpoint
    label: "Affected endpoint URL"
    field_type: url
    validation: valid_url
    inference:
      from_evidence: [http_request]
      llm_prompt: "infer_endpoint_from_request"
      confidence_threshold: 0.8
    help:
      short: "The state-changing endpoint triggered cross-origin"
      long: |
        The URL of the action that an attacker can trigger from another origin
        without the victim's intent.
      examples:
        - "https://api.example.com/account/email"
        - "https://api.example.com/transfer"

  - id: action_type
    label: "Action type"
    field_type: choice
    options: [state_change, account_modification, financial, other]
    inference:
      from_evidence: [http_request]
      llm_prompt: "infer_csrf_action"
      confidence_threshold: 0.7
    help:
      short: "What security-sensitive action does the request perform?"
      long: |
        - account_modification: changes email, password, settings.
        - financial: moves money / makes purchases.
        - state_change: any other server-side state change.
        - other: explain in the impact field.

  - id: protection_status
    label: "CSRF protection status"
    field_type: choice
    options: [none, missing_token, predictable_token, missing_samesite, other]
    inference:
      from_evidence: [http_request, http_response]
      llm_prompt: "infer_csrf_protection"
      confidence_threshold: 0.7
    help:
      short: "Why the request succeeds cross-origin"
      long: |
        - none: no anti-CSRF mechanism present.
        - missing_token: token expected but not validated.
        - predictable_token: token is guessable/static.
        - missing_samesite: session cookie lacks SameSite protection.
        - other: explain in the impact field.

  - id: state_change_proof
    label: "State-change proof"
    field_type: choice
    options: [demonstrated, claimed]
    inference:
      from_evidence: [http_response]
      llm_prompt: "infer_csrf_state_change"
      confidence_threshold: 0.7
    help:
      short: "Did you prove the action actually succeeded?"
      long: |
        - demonstrated: evidence shows the state change took effect (200 + changed value).
        - claimed: you believe it works but did not confirm the change.
        A CSRF on a read-only action is not a vulnerability.

  - id: impact_description
    label: "Impact description"
    field_type: long_text
    editor: true
    inference:
      from_evidence: [http_request, http_response, code_snippet, screenshot]
      llm_prompt: "draft_csrf_impact"
      confidence_threshold: 0.0
      mode: suggest_only
    help:
      short: "What can an attacker accomplish?"
      long: |
        Describe the concrete consequence of forcing the action (e.g. account
        takeover via email change, unauthorized fund transfer).

  - id: remediation
    label: "Suggested remediation"
    field_type: long_text
    editor: true
    is_required: false
    help:
      short: "How should the developers fix it? (optional)"
      long: |
        Suggest a concrete fix the developers can apply. Optional, but many
        programs (HackerOne, Bugcrowd) expect a remediation section.
      examples:
        - "Require an unpredictable per-session CSRF token on every state-changing request."
        - "Set SameSite=Lax or Strict on session cookies."

required_evidence:
  - type: code_snippet
    description: "HTML/JS PoC that triggers the action cross-origin"
    required: true
  - type: http_response
    description: "Response/evidence that the action succeeded"
    required: true
  - type: screenshot
    description: "Screenshot of the resulting state change"
    required: false
    note: "Strongly recommended to prove the action took effect"

severity_hints:
  default_cvss_v31: "AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N"
  notes: |
    Common adjustments:
    - I:H (and C:H) if the action leads to account takeover
    - S:C if the action affects resources beyond the vulnerable component
    - Lower if the action is not meaningfully security-sensitive

verifier_focus:
  - "Confirm the PoC actually triggers cross-origin (no same-origin assumptions)"
  - "Confirm the action is state-changing, not just a read"
  - "Confirm anti-CSRF protections are genuinely absent or bypassable"
