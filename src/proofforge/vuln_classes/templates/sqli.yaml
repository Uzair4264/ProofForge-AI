vuln_class: sqli
display_name: "SQL Injection"
cwe: CWE-89
subtypes:
  - error_based
  - blind_boolean
  - blind_time
  - union_based

required_fields:
  - id: affected_endpoint
    label: "Affected endpoint URL"
    field_type: url
    validation: valid_url
    inference:
      from_evidence: [http_request]
      llm_prompt: "infer_endpoint_from_request"
      confidence_threshold: 0.8
    help:
      short: "The endpoint containing the injection point"
      long: |
        The full URL where the injectable parameter lives.
      examples:
        - "https://api.example.com/products?id="
        - "https://api.example.com/login"

  - id: injection_point
    label: "Injection point"
    field_type: choice
    options: [url_param, form_field, header, cookie, path, other]
    inference:
      from_evidence: [http_request]
      llm_prompt: "infer_sqli_point"
      confidence_threshold: 0.75
    help:
      short: "Where the SQL payload is injected"
      long: |
        Identify which part of the request carries the injection (query string
        parameter, form field, header, cookie, or path segment).

  - id: sqli_subtype
    label: "SQLi technique"
    field_type: choice
    options: [error_based, blind_boolean, blind_time, union_based]
    inference:
      from_evidence: [http_request, http_response]
      llm_prompt: "infer_sqli_subtype"
      confidence_threshold: 0.7
    help:
      short: "Which SQLi technique did the evidence demonstrate?"
      long: |
        - error_based: database error messages leak in the response.
        - blind_boolean: response differs based on a true/false condition.
        - blind_time: response timing changes with a sleep payload.
        - union_based: data is extracted via a UNION SELECT.

  - id: database_fingerprint
    label: "Database fingerprint"
    field_type: string
    inference:
      from_evidence: [http_response]
      llm_prompt: "infer_sqli_db"
      confidence_threshold: 0.6
    is_required: false
    help:
      short: "The DBMS, if identifiable (MySQL, Postgres, MSSQL, Oracle)"
      long: |
        Any signature that identifies the backend database (error string,
        version() output, time-function behavior).

  - id: timing_measurements
    label: "Timing measurements"
    field_type: string
    is_required: false
    help:
      short: "Time-based only: response times for a baseline and two or more delays"
      long: |
        ProofForge never replays requests, so record the timings you measured
        (seconds). Give at least two baseline samples and at least two delay
        values, each repeated, e.g. "baseline: 0.21, 0.19; 5: 5.24, 5.31; 10: 10.2, 10.4".
        `verify` checks that every delay is close to its payload and that the
        delays scale with it, which rules out network jitter and a slow server.
      examples:
        - "baseline: 0.21, 0.19, 0.23; 5: 5.24, 5.31; 10: 10.22, 10.40"

  - id: impact_category
    label: "Impact category"
    field_type: choice
    options: [injection_confirmed, data_extraction, data_modification, auth_bypass, rce, other]
    inference:
      from_evidence: [http_request, http_response]
      llm_prompt: "infer_sqli_impact"
      confidence_threshold: 0.7
    help:
      short: "What the injection lets an attacker achieve"
      long: |
        - injection_confirmed: the query is injectable; no data read yet.
        - data_extraction: reading data the user shouldn't see.
        - data_modification: changing stored data (demonstrated write).
        - auth_bypass: logging in / escalating without valid credentials.
        - rce: command execution via the database.
        - other: explain in the impact field.

  - id: impact_description
    label: "Impact description"
    field_type: long_text
    editor: true
    inference:
      from_evidence: [http_request, http_response, screenshot]
      llm_prompt: "draft_sqli_impact"
      confidence_threshold: 0.0
      mode: suggest_only
    help:
      short: "What can an attacker do with this SQLi?"
      long: |
        Describe the demonstrated impact and scope (which tables/data, whether
        the whole database is reachable). Only claim what the evidence shows.

  - id: remediation
    label: "Suggested remediation"
    field_type: long_text
    editor: true
    is_required: false
    help:
      short: "How should the developers fix it? (optional)"
      long: |
        Suggest a concrete fix the developers can apply. Optional, but many
        programs (HackerOne, Bugcrowd) expect a remediation section.
      examples:
        - "Use parameterized queries / prepared statements for all database access."
        - "Never concatenate user input into SQL; run the app with a least-privilege database user."

required_evidence:
  - type: http_request
    description: "Request showing the injection payload"
    required: true
  - type: http_response
    description: "Response demonstrating SQL behavior (error, conditional, timing, extracted data)"
    required: true
  - type: screenshot
    description: "Screenshot of extracted data or timing difference"
    required: false

severity_hints:
  # Confirmed injection = the database is readable (7.5). Writes, auth bypass
  # and command execution must be demonstrated to lift I, A and S.
  default_cvss_v31: "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
  lift_rules:
    - metric: I
      to: H
      when: {impact_category: [data_modification, auth_bypass, rce]}
      note: "a demonstrated write, authentication bypass or command execution"
    - metric: A
      to: H
      when: {impact_category: [data_modification, rce]}
      note: "a demonstrated write (e.g. stacked query) or command execution"
    - metric: S
      to: C
      when: {impact_category: [rce]}
      note: "command execution through the database that reaches the host"
  notes: |
    Common adjustments:
    - PR:L/PR:H if authentication is required to reach the injection
    - I:H / A:H only with a demonstrated write, auth bypass or command execution
    - S:C only if command execution through the DBMS reaches the host

evidence_checks: [boolean_pairs, timing_scaling]

verifier_focus:
  - "Confirm the response shows genuine database behavior, not a generic error"
  - "Confirm extracted data is real, not merely echoed back from the input"
  - "Blind boolean: confirm true/false requests differ only in the condition"
  - "Flag auth-bypass / RCE claims not demonstrated by the evidence"
